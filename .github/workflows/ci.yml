name: Rust checks
on:
  push:
    branches: [main, develop, feat/v1-runtime-performance]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo run -- check examples/hello.rux
      - run: |
          output="$(cargo run --quiet -- run examples/hello.rux)"
          test "$output" = "Hello, World!"
      - name: CLI dev mode watches and restarts after valid edits
        run: |
          set -eu
          cargo build --quiet
          mkdir -p dev-smoke
          printf 'app DevSmoke {\n fn main() {\n  print("first")\n }\n}\n' > dev-smoke/main.rux
          ./target/debug/rux dev dev-smoke/main.rux > dev-smoke/output.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if grep -q 'first' dev-smoke/output.log; then break; fi
            sleep 0.25
          done
          grep -q 'first' dev-smoke/output.log
          printf 'app DevSmoke {\n fn main() {\n  print("second")\n }\n}\n' > dev-smoke/main.rux
          for i in $(seq 1 40); do
            if grep -q 'second' dev-smoke/output.log; then break; fi
            sleep 0.25
          done
          grep -q 'second' dev-smoke/output.log
          grep -q 'source changed; restarting application' dev-smoke/output.log
      - name: CRUD REST integration smoke test
        run: |
          cargo run --quiet -- crud ci_customers name email
          cd ci_customers
          node server.js > server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/records >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"name":"Ana","email":"ana@example.com"}' http://localhost:3000/api/records > created.json
          node -e 'const r=require("./created.json");if(r.name!=="Ana"||!r.id)process.exit(1)'
          curl -fsS http://localhost:3000/api/records > listed.json
          node -e 'const r=require("./listed.json");if(r.length!==1||r[0].name!=="Ana")process.exit(1)'
          id=$(node -p 'require("./created.json").id')
          curl -fsS -X PUT -H 'Content-Type: application/json' -d '{"name":"Bia","email":"bia@example.com"}' "http://localhost:3000/api/records/$id" > updated.json
          node -e 'if(require("./updated.json").name!=="Bia")process.exit(1)'
          curl -fsS -X DELETE "http://localhost:3000/api/records/$id" > deleted.json
          curl -fsS http://localhost:3000/api/records > empty.json
          node -e 'if(require("./empty.json").length!==0)process.exit(1)'
      - name: Generate CRUD from RUX source
        run: |
          cargo run --quiet -- crud-from examples/clientes_crud.rux
          test -f Clientes/index.html
          test -f Clientes/server.js
          grep -q 'nome' Clientes/server.js
      - name: Validate typed CRUD REST payloads
        run: |
          cd Clientes
          PORT=3100 node server.js > typed.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3100/api/records >/dev/null; then break; fi
            sleep 1
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"nome":"Ana","email":"not-an-email","telefone":"123"}' http://localhost:3100/api/records)
          test "$status" = "400"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"nome":"Ana","email":"ana@example.com","telefone":"123"}' http://localhost:3100/api/records)
          test "$status" = "201"
      - name: Run declarative RUX CRUD directly
        run: |
          cargo run --quiet -- check examples/clientes_crud.rux
          rm -rf Clientes
          cargo run --quiet -- run examples/clientes_crud.rux > rux-crud.log 2>&1 &
          rux_pid=$!
          trap 'kill $rux_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/records > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/records > /dev/null
          test -f Clientes/server.js
      - name: Native SQLite CRUD API smoke test
        run: |
          cargo run --quiet -- run examples/clientes_crud.rux > native.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/records >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"nome":"Ana","email":"invalid","telefone":"123"}' http://localhost:3000/api/records)" = "400"
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"nome":"Ana","email":"ana@example.com","telefone":"123"}' http://localhost:3000/api/records > native-created.json
          node -e 'if(!require("./native-created.json").id)process.exit(1)'
          test -f Clientes/records.sqlite
          curl -fsS http://localhost:3000/health/live | grep -q UP
          curl -fsS http://localhost:3000/health/ready | grep -q UP
          seq 1 50 | xargs -P 10 -I {} curl -fsS http://localhost:3000/health/ready > /dev/null
          curl -fsS http://localhost:3000/api/records > native-listed.json
          node -e 'if(require("./native-listed.json").length!==1)process.exit(1)'

      - name: Verify native CRUD search and safe schema refresh
        run: |
          set -eu
          cat > ci_refresh.rux <<'RUX'
          app CiRefresh {
              data Cliente {
                  nome: Text
                  email: Email
              }
          }
          RUX
          cargo run --quiet -- run ci_refresh.rux > ci-refresh.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"nome":"Alice","email":"alice@example.com"}' http://127.0.0.1:3000/api/records > ci-refresh-created.json
          curl -fsS 'http://127.0.0.1:3000/api/records?q=Alice&field=nome' > ci-search.json
          node -e 'if(require("./ci-search.json").length!==1)process.exit(1)'
          curl -fsS 'http://127.0.0.1:3000/api/records?q=%27%20OR%201%3D1%20--' > ci-injection.json
          node -e 'if(require("./ci-injection.json").length!==0)process.exit(1)'
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat > ci_refresh.rux <<'RUX'
          app CiRefresh {
              data Cliente {
                  nome: Text
                  email: Email
                  telefone: Text
              }
          }
          RUX
          cargo run --quiet -- run ci_refresh.rux > ci-refresh-restarted.log 2>&1 &
          pid=$!
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/health/ready >/dev/null; then break; fi
            sleep 1
          done
          grep -q '"telefone"' CiRefresh/index.html
          curl -fsS 'http://127.0.0.1:3000/api/records?q=Alice' > ci-persisted.json
          node -e 'if(require("./ci-persisted.json").length!==1)process.exit(1)'

      - name: Identity authorization and immediate revocation smoke test
        run: |
          set -euo pipefail
          cat > ci_identity.rux <<'RUX'
          app CiIdentity {
              data Customer {
                  name: Text
              }
          }
          RUX
          PORT=3200 cargo run --quiet -- run ci_identity.rux > ci-identity-seed.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3200/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3200/health/ready >/dev/null
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
          umask 077
          cargo run --quiet -- identity create CiIdentity ci_reader reader > reader-secret.txt
          cargo run --quiet -- identity create CiIdentity ci_editor editor > editor-secret.txt
          cargo run --quiet -- identity create CiIdentity ci_admin admin > admin-secret.txt
          reader=$(sed -n 's/^API token (displayed once; store securely): //p' reader-secret.txt)
          editor=$(sed -n 's/^API token (displayed once; store securely): //p' editor-secret.txt)
          admin=$(sed -n 's/^API token (displayed once; store securely): //p' admin-secret.txt)
          test "${#reader}" = "68"
          test "${#editor}" = "68"
          test "${#admin}" = "68"
          RUX_AUTH_MODE=identities PORT=3200 cargo run --quiet -- run ci_identity.rux > ci-identity-runtime.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f reader-secret.txt editor-secret.txt admin-secret.txt' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3200/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3200/health/ready >/dev/null
          url=http://127.0.0.1:3200/api/records
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$url")" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $reader" "$url")" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $reader" -H 'Content-Type: application/json' -d '{"name":"Ana"}' "$url")" = "403"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $editor" -H 'Content-Type: application/json' -d '{"name":"Ana"}' "$url")" = "201"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $editor" "$url/placeholder")" = "403"
          cargo run --quiet -- identity revoke CiIdentity ci_reader >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $reader" "$url")" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $admin" "$url")" = "200"

      - name: Native browser login and CSRF integration
        run: |
          set -euo pipefail
          cat > ci_user_login.rux <<'RUX'
          app CiUserLogin {
              data Customer {
                  name: Text
              }
          }
          RUX
          PORT=3300 cargo run --quiet -- run ci_user_login.rux > ci-user-seed.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3300/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3300/health/ready >/dev/null
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
          printf '%s\n' 'test-only-super-strong-passphrase!' | cargo run --quiet -- user create CiUserLogin ciadmin admin --password-stdin
          RUX_AUTH_MODE=users PORT=3300 cargo run --quiet -- run ci_user_login.rux > ci-user-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f ci-session-cookies.txt ci-session-login.json' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3300/health/ready >/dev/null; then break; fi
            sleep 1
          done
          url=http://127.0.0.1:3300
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$url/api/records")" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$url/auth/session")" = "401"
          umask 077
          test "$(curl -sS -o ci-session-login.json -w '%{http_code}' -c ci-session-cookies.txt -H 'Content-Type: application/json' -d '{"username":"ciadmin","password":"test-only-super-strong-passphrase!"}' "$url/auth/login")" = "200"
          csrf=$(python3 -c 'import json; print(json.load(open("ci-session-login.json"))["csrf"])')
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b ci-session-cookies.txt "$url/api/records")" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b ci-session-cookies.txt -X POST -H 'Content-Type: application/json' -d '{"name":"A"}' "$url/api/records")" = "403"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b ci-session-cookies.txt -X POST -H "X-RUX-CSRF: $csrf" -H 'Content-Type: application/json' -d '{"name":"A"}' "$url/api/records")" = "201"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b ci-session-cookies.txt -X POST -H "X-RUX-CSRF: $csrf" "$url/auth/logout")" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b ci-session-cookies.txt "$url/api/records")" = "401"
          test "$(curl -sS -o ci-session-login.json -w '%{http_code}' -c ci-session-cookies.txt -H 'Content-Type: application/json' -d '{"username":"ciadmin","password":"test-only-super-strong-passphrase!"}' "$url/auth/login")" = "200"
          cargo run --quiet -- user disable CiUserLogin ciadmin
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b ci-session-cookies.txt "$url/api/records")" = "401"

      - name: Native CRUD per-user row isolation
        run: |
          set -euo pipefail
          cat > ci_owned.rux <<'RUX'
          app CiOwned {
              data Person {
                  name: Text
              }
          }
          RUX
          PORT=3400 cargo run --quiet -- run ci_owned.rux > ci-owned-init.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3400/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3400/health/ready >/dev/null
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          umask 077
          printf '%s\n' 'test-only-super-strong-passphrase!' | cargo run --quiet -- user create CiOwned alice_writer editor --password-stdin
          printf '%s\n' 'test-only-super-strong-passphrase!' | cargo run --quiet -- user create CiOwned bob_writer editor --password-stdin
          printf '%s\n' 'test-only-super-strong-passphrase!' | cargo run --quiet -- user create CiOwned top_admin admin --password-stdin
          RUX_AUTH_MODE=users PORT=3400 cargo run --quiet -- run ci_owned.rux > ci-owned-users.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f ci-owned-*.json ci-owned-*.cookies' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3400/health/ready >/dev/null; then break; fi
            sleep 1
          done
          url=http://127.0.0.1:3400
          for user in alice_writer bob_writer top_admin; do
            curl -fsS -c "ci-owned-$user.cookies" -H 'Content-Type: application/json' \
              -d "{\"username\":\"$user\",\"password\":\"test-only-super-strong-passphrase!\"}" \
              "$url/auth/login" > "ci-owned-$user.json"
          done
          csrf=$(python3 -c 'import json; print(json.load(open("ci-owned-alice_writer.json"))["csrf"])')
          curl -fsS -b ci-owned-alice_writer.cookies -H "X-RUX-CSRF: $csrf" \
            -H 'Content-Type: application/json' -d '{"name":"private Alice"}' \
            "$url/api/records" > ci-owned-created.json
          id=$(python3 -c 'import json; print(json.load(open("ci-owned-created.json"))["id"])')
          curl -fsS -b ci-owned-alice_writer.cookies "$url/api/records" > ci-owned-alice-list.json
          curl -fsS -b ci-owned-bob_writer.cookies "$url/api/records" > ci-owned-bob-list.json
          curl -fsS -b ci-owned-top_admin.cookies "$url/api/records" > ci-owned-admin-list.json
          python3 -c 'import json; assert len(json.load(open("ci-owned-alice-list.json")))==1; assert len(json.load(open("ci-owned-bob-list.json")))==0; assert len(json.load(open("ci-owned-admin-list.json")))==1'
          bobcsrf=$(python3 -c 'import json; print(json.load(open("ci-owned-bob_writer.json"))["csrf"])')
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b ci-owned-bob_writer.cookies \
            -X PUT -H "X-RUX-CSRF: $bobcsrf" -H 'Content-Type: application/json' \
            -d '{"name":"stolen"}' "$url/api/records/$id")" = "404"
          curl -fsS -b ci-owned-alice_writer.cookies "$url/api/records" > ci-owned-after-attack.json
          python3 -c 'import json; assert json.load(open("ci-owned-after-attack.json"))[0]["name"]=="private Alice"'
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          PORT=3400 cargo run --quiet -- run ci_owned.rux > ci-owned-legacy.log 2>&1 &
          pid=$!
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3400/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$url/api/records" > ci-owned-legacy-list.json
          python3 -c 'import json; assert json.load(open("ci-owned-legacy-list.json"))==[]'

      - name: Native tenant isolation across users and roles
        run: |
          set -euo pipefail
          cat > ci_tenancy.rux <<'RUX'
          app CiTenancy {
              data Customer {
                  name: Text
              }
          }
          RUX
          PORT=3500 cargo run --quiet -- run ci_tenancy.rux > ci-tenant-init.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3500/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3500/health/ready >/dev/null
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
          umask 077
          printf '%s\n' 'test-only-long-password-123' | cargo run --quiet -- user create CiTenancy alice_global_admin admin --password-stdin
          printf '%s\n' 'test-only-long-password-123' | cargo run --quiet -- user create CiTenancy bob_editor editor --password-stdin
          printf '%s\n' 'test-only-long-password-123' | cargo run --quiet -- user create CiTenancy acme_admin reader --password-stdin
          cargo run --quiet -- tenant create CiTenancy acme 'Acme Company'
          cargo run --quiet -- tenant create CiTenancy other 'Other Company'
          cargo run --quiet -- tenant grant CiTenancy acme alice_global_admin editor
          cargo run --quiet -- tenant grant CiTenancy other alice_global_admin reader
          cargo run --quiet -- tenant grant CiTenancy other bob_editor admin
          cargo run --quiet -- tenant grant CiTenancy acme acme_admin admin
          RUX_AUTH_MODE=users RUX_TENANCY=enabled PORT=3500 cargo run --quiet -- run ci_tenancy.rux > ci-tenant-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f ci-tenant-*.json ci-tenant-*.cookies' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3500/health/ready >/dev/null; then break; fi
            sleep 1
          done
          url=http://127.0.0.1:3500
          for user in alice_global_admin bob_editor acme_admin; do
            curl -fsS -c "ci-tenant-$user.cookies" -H 'Content-Type: application/json' \
              -d "{\"username\":\"$user\",\"password\":\"test-only-long-password-123\"}" \
              "$url/auth/login" > "ci-tenant-$user.json"
          done
          curl -fsS -b ci-tenant-alice_global_admin.cookies "$url/auth/tenants" > ci-tenant-memberships.json
          python3 -c 'import json; data=json.load(open("ci-tenant-memberships.json")); assert data["enabled"]; roles={t["slug"]:t["role"] for t in data["tenants"]}; assert roles=={"acme":"editor","other":"reader"}'
          acme=$(python3 -c 'import json; data=json.load(open("ci-tenant-memberships.json")); print(next(t["id"] for t in data["tenants"] if t["slug"]=="acme"))')
          other=$(python3 -c 'import json; data=json.load(open("ci-tenant-memberships.json")); print(next(t["id"] for t in data["tenants"] if t["slug"]=="other"))')
          alicecsrf=$(python3 -c 'import json; print(json.load(open("ci-tenant-alice_global_admin.json"))["csrf"])')
          bobcsrf=$(python3 -c 'import json; print(json.load(open("ci-tenant-bob_editor.json"))["csrf"])')
          admincsrf=$(python3 -c 'import json; print(json.load(open("ci-tenant-acme_admin.json"))["csrf"])')
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b ci-tenant-alice_global_admin.cookies "$url/api/records")" = "400"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b ci-tenant-bob_editor.cookies -H "X-RUX-TENANT: $acme" "$url/api/records")" = "403"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b ci-tenant-alice_global_admin.cookies -H "X-RUX-TENANT: $other" -H "X-RUX-CSRF: $alicecsrf" \
            -H 'Content-Type: application/json' -d '{"name":"not allowed"}' "$url/api/records")" = "403"
          curl -fsS -b ci-tenant-alice_global_admin.cookies -H "X-RUX-TENANT: $acme" -H "X-RUX-CSRF: $alicecsrf" \
            -H 'Content-Type: application/json' -d '{"name":"Acme data"}' "$url/api/records" > ci-tenant-created-acme.json
          curl -fsS -b ci-tenant-bob_editor.cookies -H "X-RUX-TENANT: $other" -H "X-RUX-CSRF: $bobcsrf" \
            -H 'Content-Type: application/json' -d '{"name":"Other data"}' "$url/api/records" > ci-tenant-created-other.json
          curl -fsS -b ci-tenant-alice_global_admin.cookies -H "X-RUX-TENANT: $acme" "$url/api/records" > ci-tenant-list-acme.json
          curl -fsS -b ci-tenant-alice_global_admin.cookies -H "X-RUX-TENANT: $other" "$url/api/records" > ci-tenant-list-other.json
          python3 -c 'import json; assert [r["name"] for r in json.load(open("ci-tenant-list-acme.json"))]==["Acme data"]; assert [r["name"] for r in json.load(open("ci-tenant-list-other.json"))]==["Other data"]'
          other_id=$(python3 -c 'import json; print(json.load(open("ci-tenant-created-other.json"))["id"])')
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X PUT -b ci-tenant-acme_admin.cookies \
            -H "X-RUX-TENANT: $acme" -H "X-RUX-CSRF: $admincsrf" -H 'Content-Type: application/json' \
            -d '{"name":"stolen"}' "$url/api/records/$other_id")" = "404"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -b ci-tenant-acme_admin.cookies \
            -H "X-RUX-TENANT: $acme" -H "X-RUX-CSRF: $admincsrf" "$url/api/records/$other_id")" = "404"
          cargo run --quiet -- tenant revoke CiTenancy other bob_editor
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b ci-tenant-bob_editor.cookies \
            -H "X-RUX-TENANT: $other" "$url/api/records")" = "403"
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
          PORT=3500 cargo run --quiet -- run ci_tenancy.rux > ci-tenant-legacy.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3500/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$url/api/records" > ci-tenant-legacy-visible.json
          python3 -c 'import json; assert json.load(open("ci-tenant-legacy-visible.json"))==[]'
