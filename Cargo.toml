[package]
name = "rux"
version = "0.1.0-alpha.5"
edition = "2021"
license = "Apache-2.0"
description = "Experimental RUX language compiler frontend"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
