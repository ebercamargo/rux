[package]
name = "rux"
version = "0.1.0-alpha.6"
edition = "2021"
license = "Apache-2.0"
description = "Experimental RUX language compiler frontend"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

postgres = "0.19"
r2d2_postgres = "0.18"

chrono = "0.4"

regex = "1"

crossterm = "0.28"

sha2 = "0.10"
